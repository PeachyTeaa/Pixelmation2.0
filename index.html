<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Pixelmation 2.0</title>
    <meta name="description" content="Редактор пиксельных текстур и анимаций" />
    <script>
      // Тема ставится до отрисовки — иначе вспышка чужого фона.
      (function () {
        try {
          var saved = localStorage.getItem('pixelmation.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.classList.add('theme-' + theme);
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
